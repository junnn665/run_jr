name: ニュース自動更新

on:
  schedule:
    - cron: "23 * * * *"   # 1時間ごと
  workflow_dispatch:        # 手動実行ボタン
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  models: read        # 「今日のJR東海」のAIまとめに使う

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 決算短信を読むための部品を入れる
        run: pip install pypdf

      - name: 最新ニュースを取得
        run: python fetch_news.py

      - name: リニア進捗と業績を更新
        run: python update_panels.py

      - name: 今日のJR東海（AIまとめの準備）
        id: prep
        run: python ai_digest.py prepare

      - name: 今日のJR東海（AIに聞く）
        id: ai
        if: steps.prep.outputs.run == 'true'
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          prompt-file: ${{ runner.temp }}/digest_prompt.txt
          max-tokens: 600

      - name: 今日のJR東海（まとめを保存）
        if: steps.prep.outputs.run == 'true'
        run: python ai_digest.py finish
        env:
          AI_RESPONSE_FILE: ${{ steps.ai.outputs.response-file }}
          AI_RESPONSE: ${{ steps.ai.outputs.response }}
          AI_OUTCOME: ${{ steps.ai.outcome }}

      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json linear.json finance.json digest.json 2>/dev/null || git add news.json linear.json finance.json
          git commit -m "自動更新" || echo "変更なし"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
