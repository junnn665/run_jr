<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="JR東海の最新ニュースを新幹線・在来線・リニアなど項目別にまとめる非公式サイト">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1f2a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="東海にゅ〜す">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>東海にゅ〜す</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&family=DotGothic16&display=swap">
<style>
/* Layout: 駅の発車標のような見出し帯 → 路線色のカテゴリタブ → 日付順のニュース一覧 */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --fg:#1d2126; --muted:#626a73; --line:#dcdcd6;
  --accent:#e8780c; --accent-ink:#ffffff; --board:#1f2a33; --board-fg:#f3f1ea;
  --c-shinkansen:#1f63b8; --c-zairai:#e8780c; --c-linear:#7a4bc4; --c-eki:#2e8b57; --c-unko:#c8372d; --c-kaisha:#55606b; --c-event:#c2468a;--ch-rev:#1f63b8;--ch-net:#e8780c;--on-c:#ffffff;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181c; --surface:#1c2228; --fg:#e9e7e1; --muted:#9aa3ad; --line:#2e363e;
  --accent:#f39a3d; --accent-ink:#1a1206; --board:#0c1014; --board-fg:#f3f1ea;
  --c-shinkansen:#5c9be6; --c-zairai:#f39a3d; --c-linear:#a684e0; --c-eki:#5bbd85; --c-unko:#ea6a5f; --c-kaisha:#9aa6b2; --c-event:#e07ab3;--ch-rev:#4a86d4;--ch-net:#d47a28;--on-c:#10151a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1c2228; --fg:#e9e7e1; --muted:#9aa3ad; --line:#2e363e;
  --accent:#f39a3d; --accent-ink:#1a1206; --board:#0c1014; --board-fg:#f3f1ea;
  --c-shinkansen:#5c9be6; --c-zairai:#f39a3d; --c-linear:#a684e0; --c-eki:#5bbd85; --c-unko:#ea6a5f; --c-kaisha:#9aa6b2; --c-event:#e07ab3;--ch-rev:#4a86d4;--ch-net:#d47a28;--on-c:#10151a;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px}
header.board{padding-top:env(safe-area-inset-top,0px);background:var(--board);color:var(--board-fg);border-bottom:4px solid var(--accent)}
header.board .wrap{padding-block:20px 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.brand{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,6vw,36px);letter-spacing:.02em;line-height:1.1;margin:0}
.brand small{display:block;font-weight:500;font-size:13px;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.clock{font-family:var(--f-mono);font-size:13px;opacity:.8;font-variant-numeric:tabular-nums}
nav.tabs{background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 5px;padding-block:12px}
/* タブ：駅ナンバリング風（路線カラーの枠に記号、選ぶとその色で塗りつぶし） */
.tab{flex:none;font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:9px 8px 9px 3px;cursor:pointer;display:flex;align-items:center;gap:5px;line-height:1.5}
.tab .code{display:grid;place-items:center;min-width:20px;height:20px;padding:0 2px;border:2.5px solid var(--c);border-radius:4px;background:var(--surface);color:var(--fg);font-family:var(--f-display);font-weight:900;font-size:9.5px;letter-spacing:-.03em;line-height:1}
.tab .n{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-c)}
.tab[aria-pressed="true"] .n{color:var(--on-c);opacity:.8}
.tab:focus-visible,.search:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
.search{font:inherit;font-size:14px;padding:7px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:min(260px,100%)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:0}
ol.news{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.item{display:grid;grid-template-columns:6px 1fr;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .bar{background:var(--c)}
.item .body{padding:14px 16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.meta time{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cat{font-weight:700;color:var(--c);letter-spacing:.04em}
.new{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 6px}
.srcname{font-weight:700;color:var(--fg)}
.srcname.official{color:var(--accent)}
.status{font-size:12.5px;color:var(--muted);margin:0}
.item h3{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.45;margin:4px 0 4px;text-wrap:balance}
.item p{margin:0;color:var(--fg);opacity:.88;max-width:62ch}
.src{display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);font-weight:700;text-decoration:none}
.src:hover{text-decoration:underline}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer .wrap{padding-block:16px}
/* ===== 動き ===== */
.ticker{background:var(--board);padding-block:0 14px}
header.board .ticker .wrap{padding-block:0;display:block}
.led{--led-on:#ffa21f;--led-red:#ff4b3a;--led-green:#5dff7a;background:#0b0b0b;border:3px solid #2b2f33;border-radius:6px;box-shadow:inset 0 0 0 1px #000,0 2px 0 #000;display:flex;align-items:stretch;overflow:hidden;position:relative}
.led::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 46%,rgba(0,0,0,.55) 72%);background-size:3px 3px}
.led .label{flex:none;display:flex;align-items:center;gap:6px;font-family:"DotGothic16",var(--f-mono);font-size:17px;color:var(--led-red);text-shadow:0 0 6px rgba(255,75,58,.75);padding:6px 12px;border-right:2px solid #2b2f33;letter-spacing:.08em}
.led .label i{font-style:normal;color:var(--led-green);text-shadow:0 0 6px rgba(93,255,122,.7);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.led .lane{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center}
.led .run{display:inline-flex;gap:56px;white-space:nowrap;font-family:"DotGothic16",var(--f-mono);font-size:19px;line-height:1;padding-block:8px;color:var(--led-on);text-shadow:0 0 4px rgba(255,162,31,.9),0 0 12px rgba(255,140,0,.45);animation:tick var(--dur,40s) linear infinite;padding-left:100%}
.led .run span b{font-weight:400;color:var(--led-green);text-shadow:0 0 6px rgba(93,255,122,.7);margin-right:10px}
.ticker:hover .run{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-100%)}}

.loader{overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;color:var(--muted);font-size:13px}
.loader svg{width:min(320px,100%);height:auto;overflow:visible}
.loader .rail{stroke:var(--line);stroke-width:2}
.loader .tie{stroke:var(--line);stroke-width:3}
.loader .train{animation:run 1.6s cubic-bezier(.55,0,.45,1) infinite}
.loader .body-fill{fill:var(--surface);stroke:var(--fg);stroke-width:1.5}
.loader .stripe{fill:var(--c-shinkansen)}
.loader .win{fill:var(--fg);opacity:.75}
@keyframes run{0%{transform:translateX(-140px)}100%{transform:translateX(340px)}}

.statusbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.reload{font:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px;cursor:pointer}
.reload:hover{border-color:var(--accent);color:var(--accent)}
.reload:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reload:disabled{opacity:.55;cursor:default}
.reload svg{width:15px;height:15px}
.reload.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== リニア工事の進捗 ===== */
.lpanel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.lpanel h3{font-family:var(--f-display);font-size:18px;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.lpanel h3 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.lsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lsum div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.lsum dt{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.lsum dd{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.35}
.lsum dd span{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);display:block}
.lsec{font-family:var(--f-display);font-size:14px;margin:0;color:var(--muted);letter-spacing:.06em}
ol.route{list-style:none;margin:0;padding:0;position:relative}
ol.route::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--c-linear);opacity:.35}
.st{position:relative;padding:0 0 14px 34px}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:3px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:4px solid var(--c-linear);box-sizing:border-box}
.st.term::before{width:20px;height:20px;left:1px;top:3px;background:var(--c-linear)}
.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.st-name{font-family:var(--f-display);font-weight:700;font-size:16px}
.st-place{font-size:12px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px;border:1.5px solid currentColor}
.pill.build{color:var(--accent)}
.pill.start{color:var(--c-eki)}
.pill.wait{color:var(--c-unko)}
.pill.done{color:var(--c-shinkansen)}
.st p,.wk p{margin:3px 0 0;font-size:13.5px;line-height:1.6;max-width:62ch}
.st-foot{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:12.5px}
.st-foot a{color:var(--accent);font-weight:700;text-decoration:none}
.st-foot button{font:inherit;font-size:12.5px;font-weight:700;color:var(--c-linear);background:none;border:0;padding:0;cursor:pointer}
.st-foot button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:3px}
.st-foot button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.wk{border:1px solid var(--line);border-left:4px solid var(--c-linear);border-radius:8px;padding:10px 12px;min-width:0}
.wk .st-head{gap:4px 8px}
.wk b{font-family:var(--f-display);font-size:15px}
.lnote{font-size:12px;color:var(--muted);margin:0}
.fin{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.fin-wrap{overflow-x:auto}
.fin th,.fin td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.fin th:first-child,.fin td:first-child{text-align:left}
.fin thead th{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.4}
.fin td b{font-family:var(--f-display);font-size:15px}
.fin .up,.fin .down{display:block;font-size:11.5px}
.fin .up{color:var(--c-eki)}
.fin .down{color:var(--c-unko)}
.kpanel .lsum dd{font-size:16px}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.links a{color:var(--accent);font-weight:700;text-decoration:none}
.latest{display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin:5px 0 0}
.latest span{flex:none;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--c-linear);border-radius:3px;padding:0 5px}
.latest a{color:var(--fg);text-decoration:none;min-width:0}
.latest a:hover{text-decoration:underline}
.fin-notice{margin:0;font-size:13px;background:var(--bg);border:1.5px solid var(--accent);border-radius:8px;padding:8px 12px}
.fin-notice a{color:var(--accent);font-weight:700}
.status.stale{color:var(--c-unko);font-weight:700}

/* ===== 新着・まとめ・保存 ===== */
.toolbar .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.savedbtn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.savedbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.savedbtn:focus-visible,.star:focus-visible,.newbar button:focus-visible,.others summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.newbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700}
.newbar b{color:var(--accent);font-size:18px;font-family:var(--f-display)}
.newbar button{font:inherit;font-size:13px;font-weight:700;border:0;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.unseen{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 6px}
.item.is-unseen .body{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent 60%)}
.item .body{position:relative;padding-right:46px}
.star{position:absolute;top:6px;right:4px;font:inherit;font-size:20px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:8px;min-width:40px;min-height:40px}
.star[aria-pressed="true"]{color:#e0a200}
.others{margin-top:8px;font-size:13px}
.others summary{cursor:pointer;color:var(--muted);font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:4px}
.others summary::-webkit-details-marker{display:none}
.others summary::before{content:"＋";font-size:12px}
.others[open] summary::before{content:"－"}
.others ul{margin:6px 0 0;padding:0 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:10px}
.others a{color:var(--fg);text-decoration:none}
.others a:hover{text-decoration:underline}
.others .os{font-weight:700;color:var(--muted);margin-right:6px}
/* ===== 今日のJR東海（AIまとめ） ===== */
.digest{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.digest h3{margin:0;font-family:var(--f-display);font-size:17px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.digest h3 small{font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--accent-ink);background:var(--c-linear);border-radius:4px;padding:1px 6px}
.digest h3 time{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.digest ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.digest li{display:grid;grid-template-columns:14px 1fr;gap:6px;font-size:14.5px;line-height:1.55}
.digest li::before{content:"";width:8px;height:8px;margin-top:8px;border-radius:2px;background:var(--accent)}
.digest a{color:var(--fg);text-decoration:none}
.digest a:hover{text-decoration:underline}
.digest .dn{color:var(--muted);font-size:12px;margin-left:4px}
.digest .dnote{margin:0;font-size:11.5px;color:var(--muted)}
/* ===== リニア工事マップ ===== */
.lmap{display:flex;flex-direction:column;gap:8px}
.lmap svg{width:100%;max-width:420px;height:auto;align-self:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:6px;border-radius:3px;display:inline-block}
/* ===== 業績グラフ ===== */
.chart{display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;max-width:520px;align-self:center;touch-action:manipulation}
.chart .bar-hit{cursor:pointer}
.chart svg text,.chart svg rect:not(.bar-hit){pointer-events:none}
.chart .readout{margin:0;font-size:13px;min-height:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.chart .readout b{font-family:var(--f-display)}
.filterbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.filterbar button{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 10px;cursor:pointer}
@media (prefers-reduced-motion: reduce){
  .led .run{animation:none;padding-left:0}
  .led .label i{animation:none}
  .loader .train{animation:none;transform:translateX(100px)}
  .reload.spin svg{animation:none}
}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <h1 class="brand"><small>JR東海の最新ニュースまとめ</small>東海にゅ〜す</h1>
    <div class="clock" id="clock"></div>
  </div>
  <div class="ticker" id="ticker" aria-label="最新ニュース速報"><div class="wrap"><div class="led"><span class="label"><i>●</i>速報</span><div class="lane"><div class="run" id="run"></div></div></div></div></div>
</header>

<nav class="tabs" aria-label="カテゴリ"><div class="wrap" id="tabs"></div></nav>

<main><div class="wrap">
  <div class="toolbar">
    <h2 id="heading">すべてのニュース</h2>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="キーワードで絞り込み" aria-label="キーワード検索">
      <button type="button" class="savedbtn" id="savedbtn" aria-pressed="false">★ 保存した記事 <span id="savedn">0</span></button>
    </div>
  </div>
  <p class="note">JR東海の公式発表と、新聞・ニュースサイトの関連記事を1時間ごとに自動で取り込みます。詳しい内容は各記事の出典リンクから確認してください。</p>
  <div class="statusbar">
    <p class="status" id="status">ニュースを読み込み中…</p>
    <button type="button" class="reload" id="reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>最新に更新</button>
  </div>
  <div class="newbar" id="newbar" hidden></div>
  <section class="digest" id="digest" hidden aria-labelledby="dg-title"></section>
  <section class="lpanel" id="lpanel" hidden aria-labelledby="lp-title"></section>
  <section class="lpanel kpanel" id="kpanel" hidden aria-labelledby="kp-title"></section>
  <div class="filterbar" id="filterbar" hidden></div>
  <ol class="news" id="list"></ol>
</div></main>

/* ===== リニア工事マップ（縦の路線図。状況の色は linear.json と連動） ===== */
// 品川からのおおよその距離（km）。地図の位置合わせ用で、正確な距離ではありません
const LKM = {"品川":0,"神奈川県駅（仮称）":37,"山梨県駅（仮称）":92,"長野県駅（仮称）":178,"岐阜県駅（仮称）":223,"名古屋":286,
  "第一首都圏トンネル（品川〜神奈川）":[2,36],"南アルプストンネル 山梨工区":[113,121],"南アルプストンネル 静岡工区":[121,132],
  "伊那山地トンネル（長野）":[147,162],"中央アルプストンネル":[184,206],"岐阜県内のトンネル群":[212,262]};
const LSHORT = {"第一首都圏トンネル（品川〜神奈川）":"第一首都圏トンネル","南アルプストンネル 山梨工区":"南アルプスT（山梨）",
  "南アルプストンネル 静岡工区":"南アルプスT（静岡）","伊那山地トンネル（長野）":"伊那山地トンネル","中央アルプストンネル":"中央アルプスT",
  "岐阜県内のトンネル群":"岐阜のトンネル群"};
const STC = {build:"var(--accent)", start:"var(--c-eki)", wait:"var(--c-unko)", done:"var(--c-shinkansen)"};
function linearMap(){
  const H = 470, top = 22, X = 64, y = km => top + km / 286 * (H - top * 2);
  const short = o => (LSHORT[o.name] || o.name).replace(/（仮称）/, "");
  const lab = o => o.label.replace(/（.*?報道）/, m => m.replace("報道", ""));
  let svg = `<line x1="${X}" y1="${y(0)}" x2="${X}" y2="${y(286)}" stroke="var(--line)" stroke-width="9" stroke-linecap="round"/>`;
  // トンネル・工区（線の上に太い色の帯）と、右の列のラベル
  const works = LINEAR.works.filter(w => Array.isArray(LKM[w.name])).sort((p, q) => LKM[p.name][0] - LKM[q.name][0]);
  let lastLabelY = -99;
  for (const w of works){
    const [a, b] = LKM[w.name], c = STC[w.status] || "var(--muted)";
    svg += `<line x1="${X}" y1="${y(a)}" x2="${X}" y2="${y(b)}" stroke="${c}" stroke-width="9"/>`;
    let ly = Math.max((y(a) + y(b)) / 2, lastLabelY + 34); lastLabelY = ly;
    svg += `<path d="M${X + 7} ${(y(a) + y(b)) / 2} H${X + 92} L${X + 102} ${ly}" fill="none" stroke="${c}" stroke-width="1.5"/>`;
    svg += `<text x="${X + 108}" y="${ly - 2}" font-size="14" font-weight="700" fill="var(--fg)">${esc(short(w))}</text>`;
    svg += `<text x="${X + 108}" y="${ly + 14}" font-size="12" fill="${c}" font-weight="700">● ${esc(lab(w))}</text>`;
  }
  // 駅（線の上の丸）と、左側の駅名
  for (const st of LINEAR.stations){
    const km = LKM[st.name]; if (typeof km !== "number") continue;
    const c = STC[st.status] || "var(--muted)", r = st.term ? 11 : 8;
    svg += `<circle cx="${X}" cy="${y(km)}" r="${r}" fill="var(--surface)" stroke="${c}" stroke-width="4"/>`;
    svg += `<text x="${X - 18}" y="${y(km) + 5}" font-size="14" font-weight="900" text-anchor="end" fill="var(--fg)">${esc(short(st).replace("県駅",""))}</text>`;
  }
  const legend = [["build","建設中・掘削中"],["start","着工"],["wait","停止・着工前"],["done","貫通・完成"]]
    .map(([k,t]) => `<span><i style="background:${STC[k]}"></i>${t}</span>`).join("");
  return `<div class="lmap"><div class="legend">${legend}<span><i style="background:var(--line)"></i>その他の区間</span></div>
    <svg viewBox="0 0 330 ${H}" role="img" aria-label="品川から名古屋までのリニア工事の状況を示す路線図">${svg}</svg>
    <p class="lnote">位置はおおよそです。色は下の各駅・各工区の状況と同じで、自動で切り替わります。</p></div>`;
}

/* ===== 業績グラフ（営業収益と純利益の推移。決算短信を読むたびに自動で1年分増える） ===== */
function finChart(){
  const hs = (FIN.history || []); if (!hs.length) return "";
  const W = 340, H = 230, L = 46, R = 8, T = 14, B = 34;
  const vals = hs.flatMap(h => [h.rev, h.net]);
  const max = Math.ceil(Math.max(...vals) / 5000) * 5000, min = Math.min(0, Math.floor(Math.min(...vals) / 5000) * 5000);
  const yv = v => T + (max - v) / (max - min) * (H - T - B);
  const gw = (W - L - R) / hs.length, bw = Math.min(14, gw / 2 - 3);
  const fmtY = v => v === 0 ? "0" : (Math.abs(v) >= 10000 ? (v / 10000) + "兆" : (v / 1000) + "千億");
  let g = "";
  for (let v = min; v <= max; v += 5000)
    g += `<line x1="${L}" x2="${W - R}" y1="${yv(v)}" y2="${yv(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 1}"/>
          <text x="${L - 6}" y="${yv(v) + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtY(v)}</text>`;
  const bar = (x, v, col, fc) => {
    const y0 = yv(0), y1 = yv(v), top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y1 - y0));
    return `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="2" fill="${fc ? "url(#hatch-" + col + ")" : "var(--ch-" + col + ")"}" ${fc ? `stroke="var(--ch-${col})" stroke-width="1.2"` : ""}/>`;
  };
  hs.forEach((h, i) => {
    const cx = L + gw * i + gw / 2;
    g += bar(cx - bw - 1, h.rev, "rev", h.forecast) + bar(cx + 1, h.net, "net", h.forecast);
    g += `<text x="${cx}" y="${H - B + 15}" font-size="11.5" text-anchor="middle" fill="var(--fg)" font-weight="${h.forecast ? 400 : 700}">${String(h.fy).slice(2)}</text>`;
    if (h.forecast) g += `<text x="${cx}" y="${H - B + 28}" font-size="10" text-anchor="middle" fill="var(--muted)">予想</text>`;
    g += `<rect class="bar-hit" data-i="${i}" x="${L + gw * i}" y="${T}" width="${gw}" height="${H - T - B + 30}" fill="transparent"><title>${h.fy}年3月期${h.forecast ? "（会社予想）" : ""}：営業収益 ${h.rev.toLocaleString("ja-JP")}億円／純利益 ${h.net.toLocaleString("ja-JP")}億円</title></rect>`;
  });
  const hatch = c => `<pattern id="hatch-${c}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--ch-${c})" stroke-width="2"/></pattern>`;
  return `<div class="chart">
    <div class="legend"><span><i style="background:var(--ch-rev)"></i>営業収益</span><span><i style="background:var(--ch-net)"></i>純利益（親会社株主に帰属）</span><span>斜線＝会社予想</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="JR東海の営業収益と純利益の推移（3月期、億円）" id="finsvg"><defs>${hatch("rev")}${hatch("net")}</defs>${g}</svg>
    <p class="readout" id="finread">${finRead(hs[hs.map(h => !h.forecast).lastIndexOf(true)] || hs[0])}</p>
    <p class="lnote">棒をタップすると、その年の数字に切り替わります（「26」＝2026年3月期）。</p></div>`;
}
document.addEventListener("click", e => {
  const r = e.target.closest && e.target.closest(".bar-hit"); if (!r) return;
  const h = (FIN.history || [])[+r.dataset.i]; if (!h) return;
  $("#finread").innerHTML = finRead(h);
});
function finRead(h){ return h ? `<b>${h.fy}年3月期${h.forecast ? "（会社予想）" : ""}</b>　営業収益 <b>${h.rev.toLocaleString("ja-JP")}</b>億円／純利益 <b>${h.net.toLocaleString("ja-JP")}</b>億円` : ""; }

function hm(iso){ const d=new Date(iso), p=n=>String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function latestLine(x){ return x.latest ? `<p class="latest"><span>最新</span><a href="${esc(x.latest.url)}" target="_blank" rel="noopener">${fmt(x.latest.date).slice(5).replace(".","/")} ${esc(x.latest.title)}</a></p>` : ""; }
let LFILTER = null;
function linearNews(kw){ return NEWS.filter(x => x.cat==="linear" && !NOISE.test(x.title) && kw.some(k => x.title.includes(k))); }
/* イベントや見学会など、工事の進み具合と関係ない記事は「関連ニュース」に入れない */
const NOISE = /フェス|見学|寄せ書き|ツアー|イベント|グッズ|展示|体験|記念|利回り|物件|不動産|分譲|賃貸|投資|徒歩/;
function renderLinear(){

    return `<button type="button" data-f="${esc(o.name)}" aria-pressed="${LFILTER&&LFILTER.name===o.name}">関連ニュース ${n}件</button>`; };
  $("#lpanel").innerHTML = `

    ${linearMap()}
    <h4 class="lsec">駅の工事（品川 → 名古屋）</h4>
    <ol class="route">${LINEAR.stations.map(x=>`<li class="st${x.term?" term":""}">
      <div class="st-head"><span class="st-name">${x.name}</span><span class="st-place">${x.place}</span><span class="pill ${x.status}">${x.label}</span></div>
      <p>${x.note}</p>${latestLine(x)}<div class="st-foot">${btn(x)}<a href="${x.status_src||x.src}" target="_blank" rel="noopener">出典 →</a></div></li>`).join("")}</ol>
    <h4 class="lsec">主なトンネル・工区</h4>
    <div class="wks">${LINEAR.works.map(x=>`<div class="wk">
      <div class="st-head"><b>${x.name}</b><span class="pill ${x.status}">${x.label}</span></div>
      <p>${x.note}</p>${latestLine(x)}<div class="st-foot">${btn(x)}<a href="${x.status_src||x.src}" target="_blank" rel="noopener">出典 →</a></div></div>`).join("")}</div>
    <p class="lnote">1時間ごとに駅名・工区名のニュースを集め、見出しに「貫通」「着工」「完成」などが出ると状況の表示が自動で切り替わります。説明文は報道と公式資料をもとにまとめたものです。</p>`;
}
$("#lpanel").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  const all = [...LINEAR.stations, ...LINEAR.works];
  const o = all.find(x => x.name === b.dataset.f);
  LFILTER = (LFILTER && LFILTER.name === o.name) ? null : o;
  renderLinear(); renderList();
  if (LFILTER) $("#filterbar").scrollIntoView({behavior:"smooth", block:"start"});
});

function renderTabs(){
  $("#tabs").innerHTML = CATS.map(c => {
    const n = c.id==="all" ? NEWS.length : c.id==="lprog" ? "" : NEWS.filter(x=>x.cat===c.id).length;
    return `<button class="tab" style="--c:${c.color}" data-id="${c.id}" aria-pressed="${c.id===current}">
      <span class="code" aria-hidden="true">${c.code}</span>${c.name}</button>`;
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => {
    current = b.dataset.id; LFILTER = null; SAVEDVIEW = false; ONLY_NEW = false; updateSavedCount(); renderTabs(); renderLinear(); renderFin(); renderList();
  });
}
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function isNew(d){ return (Date.now()-new Date(d+"T00:00:00+09:00"))/864e5 < 3; }
function fmt(d){ const [y,m,day]=d.split("-"); return `${y}.${m}.${day}`; }

/* ===== スマホの中だけに保存するもの（前回見た時刻・★保存） ===== */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let SEEN_PREV = null;          // 前回サイトを開いたときの時刻（この時刻より後に入った記事が「新着」）
let ONLY_NEW = false;          // 新着だけ表示
let SAVEDVIEW = false;         // 保存した記事を表示
let SAVED = store.get("saved", {});   // url → 記事
let DIGEST = null;             // 今日のJR東海（AIまとめ）
const isUnseen = x => !!(SEEN_PREV && x.added && x.added > SEEN_PREV);

/* 同じ話題（g が同じ記事）を1つにまとめる。代表は公式発表、なければいちばん短い見出し */
function toTopics(items){
  const m = new Map();
  for (const x of items){ const k = SAVEDVIEW ? x.url : (x.g || x.url); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return [...m.values()].map(xs => {
    xs.sort((a,b) => b.date.localeCompare(a.date));
    const main = xs.find(x => x.src === "JR東海") || xs.reduce((a,b) => (b.title.length < a.title.length ? b : a));
    return { main, others: xs.filter(x => x !== main), date: xs[0].date, unseen: xs.some(isUnseen) };
  }).sort((a,b) => b.date.localeCompare(a.date) || (b.others.length - a.others.length));
}

function renderList(){
  const q = $("#q").value.trim().toLowerCase();
  const base = SAVEDVIEW ? Object.values(SAVED) : NEWS;
  const items = base
    .filter(x => SAVEDVIEW || current==="all" || (current==="lprog" ? x.cat==="linear" : x.cat===current))
    .filter(x => !q || (x.title+(x.summary||"")).toLowerCase().includes(q))
    .filter(x => !LFILTER || (!NOISE.test(x.title) && LFILTER.kw.some(k => x.title.includes(k))));
  let topics = toTopics(items);
  if (ONLY_NEW && !SAVEDVIEW) topics = topics.filter(t => t.unseen);
  const title = SAVEDVIEW ? "保存した記事" : current==="all" ? "すべてのニュース" : current==="lprog" ? "リニア工事進捗" : catOf(current).name + "のニュース";
  $("#heading").textContent = title + ((current==="lprog" && !SAVEDVIEW) || LOADING ? "" : `（${topics.length}件）`);
  const fb = $("#filterbar");
  fb.hidden = !LFILTER || SAVEDVIEW;
  if (LFILTER){ fb.innerHTML = `<span>「${esc(LFILTER.name)}」のニュース ${topics.length}件</span><button type="button" id="clearf">絞り込みを解除</button>`;
    $("#clearf").onclick = () => { LFILTER = null; renderLinear(); renderList(); }; }
  renderNewbar(); renderDigest();
  const list = $("#list");
  // 工事進捗タブは進捗の欄だけ。「関連ニュース」ボタンを押したときだけ一覧を出す
  const panelOnly = current === "lprog" && !LFILTER && !SAVEDVIEW;
  list.hidden = panelOnly;
  $("#q").hidden = current === "lprog" && !SAVEDVIEW;
  document.querySelector(".note").hidden = current === "lprog" || SAVEDVIEW;
  if (panelOnly) return;
  if (LOADING){ list.innerHTML = `<li>${LOADER}</li>`; return; }
  const srcName = x => x.src==="JR東海" ? "公式発表" : esc(x.src||"");
  list.innerHTML = topics.length ? topics.map(t => {
    const x = t.main, c = catOf(x.cat), saved = !!SAVED[x.url];
    const badge = t.unseen ? '<span class="unseen">新着</span>' : (!SEEN_PREV && isNew(t.date) ? '<span class="new">NEW</span>' : '');
    return `<li class="item${t.unseen?" is-unseen":""}" style="--c:${c.color}"><span class="bar"></span><div class="body">
      <div class="meta"><time datetime="${t.date}">${fmt(t.date)}</time><span class="cat">${c.name}</span><span class="srcname${x.src==="JR東海"?" official":""}">${srcName(x)}</span>${badge}
        <button type="button" class="star" data-url="${esc(x.url)}" aria-pressed="${saved}" aria-label="${saved?"保存を取り消す":"あとで読むに保存"}">${saved?"★":"☆"}</button></div>
      <h3>${esc(x.title)}</h3>${x.summary?`<p>${esc(x.summary)}</p>`:''}
      <a class="src" href="${esc(x.url)}" target="_blank" rel="noopener">出典を見る →</a>
      ${t.others.length ? `<details class="others"><summary>同じ話題の記事 ほか${t.others.length}件</summary><ul>${t.others.map(o =>
        `<li><a href="${esc(o.url)}" target="_blank" rel="noopener"><span class="os">${srcName(o)}</span>${esc(o.title)}</a></li>`).join("")}</ul></details>` : ""}
    </div></li>`;
  }).join("") : `<li class="empty">${SAVEDVIEW ? "保存した記事はまだありません。記事の右上の☆を押すと、ここに残ります。" : ONLY_NEW ? "新着の記事はありません" : NEWS.length ? "該当するニュースはありません" : "読み込み中…"}</li>`;
}

/* ★ボタン：押すとスマホの中に記事を保存 */
$("#list").addEventListener("click", e => {
  const b = e.target.closest(".star"); if (!b) return;
  const url = b.dataset.url;
  if (SAVED[url]) delete SAVED[url];
  else { const x = NEWS.find(n => n.url === url) || Object.values(SAVED).find(n => n.url === url); if (x) SAVED[url] = {...x, g: undefined, saved_at: new Date().toISOString()}; }
  store.set("saved", SAVED);
  updateSavedCount(); renderList();
});
function updateSavedCount(){ $("#savedn").textContent = Object.keys(SAVED).length; $("#savedbtn").setAttribute("aria-pressed", SAVEDVIEW); }
$("#savedbtn").addEventListener("click", () => { SAVEDVIEW = !SAVEDVIEW; ONLY_NEW = false; updateSavedCount(); renderLinear(); renderFin(); renderList(); });

/* 「前回から○件の新着」 */
function renderNewbar(){
  const bar = $("#newbar");
  const n = SEEN_PREV ? toTopics(NEWS.filter(isUnseen)).length : 0;
  bar.hidden = LOADING || SAVEDVIEW || !n;
  if (bar.hidden) return;
  bar.innerHTML = `<span>前回（${hm(SEEN_PREV)}）から <b>${n}</b> 件の新着</span>
    <button type="button" id="onlynew">${ONLY_NEW ? "すべて表示" : "新着だけ表示"}</button>`;
  $("#onlynew").onclick = () => { ONLY_NEW = !ONLY_NEW; renderList(); };
}

/* 今日のJR東海（AIまとめ）：「すべて」タブの上に出す */
function renderDigest(){
  const box = $("#digest");
  const fresh = DIGEST && DIGEST.items && DIGEST.items.length && (Date.now() - new Date(DIGEST.generated)) / 36e5 < 36;
  box.hidden = LOADING || SAVEDVIEW || ONLY_NEW || current !== "all" || !fresh;
  if (box.hidden) return;
  const link = it => { const x = NEWS.find(n => n.g === it.g && n.src === "JR東海") || NEWS.find(n => n.g === it.g) || NEWS.find(n => n.url === it.g); return x ? x.url : it.g; };
  const ai = DIGEST.ai !== false;
  box.innerHTML = `<h3 id="dg-title">今日のJR東海<small>${ai ? "AI要約" : "注目の話題"}</small><time>${hm(DIGEST.generated)}</time></h3>
    <ul>${DIGEST.items.map(it => `<li><a href="${esc(link(it))}" target="_blank" rel="noopener">${esc(it.text)}${!ai && it.n > 1 ? `<span class="dn">（${it.n}件の記事）</span>` : ""}</a></li>`).join("")}</ul>
    <p class="dnote">${ai ? "ニュースの見出しだけをもとにAIがまとめたものです。間違いがある場合もあるので、詳しくは各記事で確認してください。" : "この24時間で、多くの記事が出た話題の順に並べています。"}</p>`;
}

function renderTicker(){
  $("#ticker").hidden = !NEWS.length;
  const top = [...NEWS].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  $("#run").innerHTML = top.map(x => `<span><b>${fmt(x.date).slice(5).replace(".","/")}</b>${esc(x.title)}</span>`).join("");
  const chars = top.reduce((n,x)=>n+x.title.length,0);
  $("#run").style.setProperty("--dur", Math.max(25, chars*0.28) + "s");
}

$("#q").addEventListener("input", renderList);

function tick(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  $("#clock").textContent = `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`;
}
tick(); setInterval(tick, 30000);
renderTabs(); renderList();

async function load(){
  LOADING = true; renderList();
  const btn = $("#reload"); btn.disabled = true; btn.classList.add("spin");
  const wait = new Promise(r => setTimeout(r, 1500));
  try{
    const get = async (f) => { const r = await fetch(f + "?t=" + Date.now(), {cache:"no-store"}); if (!r.ok) throw new Error(f); return r.json(); };
    try { LINEAR = await get("linear.json"); } catch(e){}
    try { FIN = await get("finance.json"); } catch(e){}
    const r = await fetch("news.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    NEWS = data.items || [];
    try { DIGEST = await get("digest.json"); } catch(e){ DIGEST = null; }
    if (SEEN_PREV === null){                       // このページを開いたときに1回だけ
      SEEN_PREV = store.get("seenAt", "");
      store.set("seenAt", data.checked || data.updated || "");
    }
    UPDATED = data.updated || "";
    const checked = data.checked || UPDATED;
    const st = $("#status");
    const hours = checked ? (Date.now() - new Date(checked)) / 36e5 : 99;
    st.classList.toggle("stale", hours > 3);
    st.textContent = (checked ? `最終チェック：${hm(checked)}` : "") +
      (UPDATED ? `・最新記事の追加：${hm(UPDATED)}` : "") + `・${NEWS.length}件` +
      (hours > 3 && navigator.onLine ? "　※自動更新が止まっている可能性があります" : "");
    if (!navigator.onLine){ st.classList.remove("stale"); st.textContent = "オフライン：前回読み込んだ内容を表示しています（" + st.textContent + "）"; }
  }catch(e){
    $("#status").textContent = "ニュースを読み込めませんでした。時間をおいて再読み込みしてください。";
  }
  await wait;
  LOADING = false;
  btn.disabled = false; btn.classList.remove("spin");
  renderTabs(); renderLinear(); renderFin(); renderList(); renderTicker();
}
$("#reload").addEventListener("click", load);
updateSavedCount();
// 電波が戻ったら自動で読み直す
window.addEventListener("online", load);
// ホーム画面に追加したときに、電波がなくても前回の内容を出せるようにする
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && !/claude/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
renderLinear();
renderFin();
renderTicker();
load();
</script>
</body>
</html>
